clip:
  min_seconds: 20
  max_seconds: 60
  keep_top: 8
  candidates_target: 20
models:
  find: claude-haiku-5-5     # cheap pass
  score: claude-sonnet-5-5   # quality pass
pricing:                     # USD per million tokens; copied from the live pricing page
  checked: "2026-10-10"
  source: https://platform.claude.com/docs/en/about-claude/pricing
  models:
    claude-haiku-5-5:
      input_per_mtok: 0.10
      output_per_mtok: 0.50
      max_prompt_tokens: 100000   # above this the price is higher; the guard refuses such calls
    claude-sonnet-5-5:
      input_per_mtok: 2.00
      output_per_mtok: 10.00
budget:
  max_usd_per_run: 1.00
  max_usd_per_day: 5.00      # UTC day, counted from runs/_ledger/costs.jsonl
candidates:
  block_minutes: 10
  per_block_max: 8
  max_output_tokens: 2000
  snap_padding_seconds: 0.2
  dedupe_overlap: 0.5        # overlap / shorter length; above this the later one is dropped
  thinking: disabled         # disabled / adaptive (Haiku 5.5 accepts both)
  effort: low                # low / medium / high / xhigh / max
  fallback_max_words: 40     # a segment edge is a sentence boundary only after this many unpunctuated words
  preferred_min_seconds: 30  # min_seconds <= preferred_min < preferred_max <= max_seconds
  preferred_max_seconds: 50  # asked of the model; short moments grow toward preferred_min
score:
  max_per_call: 20           # candidates judged together in one call; more are sent in chunks
  max_output_tokens: 8000    # thinking and answer together
  thinking: between_tools    # Sonnet 5.5 rejects "disabled"; this is the lowest it accepts
  effort: medium             # low / medium / high (xhigh and max need thinking: adaptive)
  min_score: 6               # 1-10; a keep below this is dropped (dropped_by: min_score)
  repair_attempts: 1         # 0 or 1: extra call when the answer is invalid
transcribe:                  # defaults chosen in D-011 from the Brief 3 benchmark (setting B)
  model: small               # tiny base small medium large-v3 turbo distil-large-v3 ...
  device: auto               # auto / cpu / cuda
  compute_type: auto         # auto (cuda: int8_float16, cpu: int8) / float16 / int8_float16 / int8 / float32
  language: null             # null = auto-detect, or an ISO code such as en
  beam_size: 5
  vad_filter: true
  condition_on_previous_text: false   # false reduces repetition loops on long audio
  batch_size: 0              # 0 = normal; >0 = batched pipeline (needs vad_filter)
  cpu_threads: 0             # 0 = library default
video:                       # the render stage's output size
  width: 1080
  height: 1920
  crop: center               # center | speaker (speaker: Brief 8; the render stage does not use it yet)
speaker:                     # speaker-following crop analysis: clipmachine track <run-folder>
  sample_fps: 10             # frames analysed per second of clip (0-30)
  analysis_width: 640        # pixels; frames are scaled to this width before face detection
  max_faces: 4               # faces looked for in each frame (1-8)
  window_seconds: 0.5        # the speaker is chosen per window of this length
  min_shot_seconds: 1.5      # no shot is shorter than this (no flicker); at least window_seconds
  switch_ratio: 1.5          # a challenger's mouth movement must exceed the speaker's by this factor
  confirm_windows: 2         # ... in this many windows in a row before the camera cuts
  dead_zone: 0.08            # fraction of the crop width: smaller face movements do not move the crop
  smoothing: 0.25            # 0-1, how fast the crop follows a face (1 = no smoothing)
  min_face_height: 0.08      # fraction of frame height; smaller faces (webcam boxes) fall back to centre
  link_max_distance: 0.12    # fraction of frame width: faces this close between samples are one person
  min_speech_words_per_window: 1   # transcript words a window needs to count as speech
  debug_preview: false       # also write clips/<id>.track.preview.mp4 (the track command's --preview)
render:
  crf: 20                    # x264 quality, 0-51, lower is better
  preset: medium             # x264 speed/size trade-off
  audio_bitrate: 160k
fetch:
  max_size_gb: 8             # GiB (1024^3 bytes)
  max_duration_minutes: 240
  min_duration_seconds: 60
captions:
  words_per_line: 3
  font: Montserrat
  highlight_color: "#FFD400"
  font_file: Montserrat-Bold.ttf   # inside assets/fonts/; a missing file fails the render stage
  font_size: 80              # pixels on the 1080x1920 canvas
  margin_v: 350              # pixels from the bottom edge, clear of phone UI
  offset_seconds: 0.0        # -1.0 to 1.0; positive = captions appear later (sync tuning)
