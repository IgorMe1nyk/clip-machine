[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipmachine"
version = "0.1.0"
description = "Turns long videos into short vertical clips."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=1.13.0",
    "faster-whisper>=1.2.1",
    "mediapipe>=1.1.0",
    "numpy>=2.4.6",
    "opencv-contrib-python>=5.0.0.93",
    "pydantic>=2.14.0",
    "pypdf>=6.20.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
clipmachine = "clipmachine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmachine"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# These two ship no type information; only utils/whisper.py imports them.
module = ["faster_whisper", "faster_whisper.*", "ctranslate2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mediapipe ships no type information; only utils/faces.py imports it.
module = ["mediapipe", "mediapipe.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: needs ffmpeg and ffprobe on PATH; skipped when they are missing",
    "whisper: runs a real Whisper model on the CPU; skipped unless CLIPMACHINE_WHISPER_TESTS=1",
    "mediapipe: runs the real Face Landmarker; skipped unless CLIPMACHINE_MEDIAPIPE_TESTS=1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
# Optional: CUDA 12 libraries for faster-whisper on an NVIDIA GPU. Not installed by default and
# never in CI. Install with: uv sync --locked --group gpu (plain `uv sync` removes them again).
# No upper bound: the newest nvidia-cudnn-cu12 has a Windows wheel (checked 2026-10-10).
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
]
