[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipmachine"
version = "0.1.0"
description = "Turns long videos into short vertical clips."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
clipmachine = "clipmachine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmachine"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# These two ship no type information; only utils/whisper.py imports them.
module = ["faster_whisper", "faster_whisper.*", "ctranslate2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: needs ffmpeg and ffprobe on PATH; skipped when they are missing",
    "whisper: runs a real Whisper model on the CPU; skipped unless CLIPMACHINE_WHISPER_TESTS=1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
