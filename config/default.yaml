clip:
  min_seconds: 20
  max_seconds: 90            # D-018: some complete thoughts need about 70 s
  keep_top: 8
  candidates_target: 20
models:
  find: claude-haiku-5-5     # cheap pass
  score: claude-sonnet-5-5   # quality pass
pricing:                     # USD per million tokens; copied from the live pricing page
  checked: "2026-10-10"
  source: https://platform.claude.com/docs/en/about-claude/pricing
  models:
    claude-haiku-5-5:
      input_per_mtok: 0.10
      output_per_mtok: 0.50
      max_prompt_tokens: 100000   # above this the price is higher; the guard refuses such calls
    claude-sonnet-5-5:
      input_per_mtok: 2.00
      output_per_mtok: 10.00
budget:
  max_usd_per_run: 1.00
  max_usd_per_day: 5.00      # UTC day, counted from runs/_ledger/costs.jsonl
candidates:
  block_minutes: 10
  per_block_max: 8
  max_output_tokens: 2000
  snap_padding_seconds: 0.2  # accepted but no longer used: cut times come from snap.max_start_pad_seconds / max_end_pad_seconds
  dedupe_overlap: 0.5        # overlap / shorter length; above this the later one is dropped
  thinking: disabled         # disabled / adaptive (Haiku 5.5 accepts both)
  effort: low                # low / medium / high / xhigh / max
  fallback_max_words: 40     # an unpunctuated run longer than this many words is split (at pauses, then at its largest gap)
  preferred_min_seconds: 30  # min_seconds <= preferred_min < preferred_max <= max_seconds
  preferred_max_seconds: 50  # asked of the model; short moments grow toward preferred_min
snap:                        # where a clip may be cut (Brief 10)
  min_pause_seconds: 0.35    # an unpunctuated gap between words this long is a sentence boundary
  min_cut_gap: 0.15          # never cut where the gap between words is smaller; <= min_pause_seconds
  max_start_pad_seconds: 0.25   # the cut sits in the middle of the pause, at most this far before the first word
  max_end_pad_seconds: 0.5   # the cut sits in the middle of the pause, at most this far after the last word
score:
  max_per_call: 20           # candidates judged together in one call; more are sent in chunks
  max_output_tokens: 8000    # thinking and answer together
  thinking: between_tools    # Sonnet 5.5 rejects "disabled"; this is the lowest it accepts
  effort: medium             # low / medium / high (xhigh and max need thinking: adaptive)
  min_score: 6               # 1-10; a keep below this is dropped (dropped_by: min_score)
  repair_attempts: 1         # 0 or 1: extra call when the answer is invalid
  extend_before: 4           # 0-10; sentences before a clip the judge may extend into
  extend_after: 3            # 0-10; sentences after a clip the judge may extend into
transcribe:                  # model and device from D-011; prompt in every window plus conditioning from D-017
  model: small               # tiny base small medium large-v3 turbo distil-large-v3 ...
  device: auto               # auto / cpu / cuda
  compute_type: auto         # auto (cuda: int8_float16, cpu: int8) / float16 / int8_float16 / int8 / float32
  language: null             # null = auto-detect, or an ISO code such as en
  beam_size: 5
  vad_filter: true
  condition_on_previous_text: true    # D-017: with style_prompt in every window, keeps sentence punctuation
  batch_size: 0              # 0 = normal; >0 = batched pipeline (needs vad_filter)
  cpu_threads: 0             # 0 = library default
  style_prompt: "Okay. So, here's what happened, and why it matters. Does that make sense? Yes, it does. Let's keep going."   # sent to Whisper with every window to keep sentence punctuation; null = off
video:                       # the render stage's output size
  width: 1080
  height: 1920
  crop: speaker              # speaker (default): follow the active speaker; needs both face model files, fetched once with clipmachine fetch-face-model | center: a fixed centre crop
  zoom:                      # punch-in zooms (Brief R2, eased in R2.1): a tighter crop on some sentence starts, then back out
    enabled: true            # false = the crop is exactly as before
    style: smooth            # smooth: ease in and out over ramp_s | punch: an instant jump
    ramp_s: 0.4              # seconds one ease takes (0-2); 2 * ramp_s must not exceed min_gap_s
    scale: 1.15              # the crop window is this much tighter (1-2)
    loud_pct: 0.30           # besides the first spoken line, zoom on this share of the loudest sentences (0-1)
    min_gap_s: 4.0           # least seconds between two zoom changes (also from any camera cut: 0.5)
    max_hold_s: 6.0          # longest a zoom-in lasts; not below min_gap_s
    max_upscale: 2.1         # a 1080p source sits at 2.05 with scale 1.15; a zoom that would enlarge the source more than this is skipped (note zoom_skipped_upscale)
speaker:                     # speaker-following crop analysis: clipmachine track <run-folder>
  sample_fps: 10             # frames analysed per second of clip (0-30)
  detect_width: 960          # pixels; frames are scaled to this width for the YuNet face detector
  landmark_width: 1920       # pixels; frames are decoded at this width (never above the source's); mouth crops come from them
  detect_score: 0.7          # 0-1, the YuNet score a face needs
  face_crop_scale: 2.0       # the crop around a face for the mouth reading is this many times its box (1-6)
  cut_threshold: 0.12        # 0-1, picture change between two samples that counts as a shot cut
  max_faces: 4               # faces looked for in each frame (1-8)
  detect_every: 1            # face boxes are detected on every Nth sample and reused in between (1-10)
  window_seconds: 0.5        # the speaker is chosen per window of this length
  signal: mouth              # mouth = mouth-openness variance (default, D-019); mix = mouth against loudness, else pixel motion
  min_shot_seconds: 1.5      # signal mouth: no shot is shorter than this (no flicker); at least window_seconds
  min_turn_seconds: 1.0      # signal mix: shortest stretch of a new speaker that gets a cut (windows decided by sync); at least window_seconds
  min_turn_motion_seconds: 1.5   # the same in windows decided by pixel motion (noisier); at least window_seconds
  switch_ratio: 1.5          # a challenger's mouth movement must exceed the speaker's by this factor
  confirm_windows: 2         # ... in this many windows in a row before the camera cuts
  dead_zone: 0.15            # fraction of the crop width the face may drift before the camera moves
  smoothing: 0.25            # unused since Brief 8.2 (no exponential smoothing any more); old files carry it
  smooth_seconds: 0.5        # the face path is averaged over this many seconds, centred (no lag); 0 = off
  glide_seconds: 0.6         # the shortest glide when the camera does move
  max_speed: 0.8             # crop widths per second: the fastest the crop may move inside a shot
  min_face_height: 0.08      # fraction of frame height; smaller faces are ignored; if nearly all are smaller, centre crop
  link_max_distance: 0.12    # fraction of frame width: faces this close between samples are one person
  min_speech_words_per_window: 1   # transcript words a window needs to count as speech
  debug_preview: false       # also write clips/<id>.track.preview.mp4 (the track command's --preview)
render:
  crf: 20                    # x264 quality, 0-51, lower is better
  preset: medium             # x264 speed/size trade-off
  audio_bitrate: 160k
  audio_fade_seconds: 0.08   # seconds of audio fade-in and fade-out on every clip; 0 = off
fetch:
  max_size_gb: 8             # GiB (1024^3 bytes)
  max_duration_minutes: 240
  min_duration_seconds: 60
captions:
  style: box_karaoke         # box_karaoke: karaoke words on a dark rounded box, D-022 | legacy: the older white outlined captions
  font: Montserrat
  font_file: Montserrat-Bold.ttf   # inside assets/fonts/; a missing file fails the render stage
  font_size: 96              # ASS font size = line height in pixels on the 1080x1920 canvas; capital letters are about 0.45 of it (D-022)
  offset_seconds: 0.15       # -1.0 to 1.0; positive = captions appear later (sync tuning)
  max_words: 4               # words on one line (1-12)
  max_width_px: 760          # the box, padding included; must fit between safe.left and safe.right
  word_gap_em: 0.45          # gap between words as a fraction of font_size
  letter_spacing_px: 1       # extra pixels after every letter (0-10)
  line_gap_em: 0.35          # gap between the hook's two lines as a fraction of its font size
  spoken_color: "#FFD400"    # words already spoken
  upcoming_color: "#FFFFFF"  # words not yet spoken
  box_opacity: 0.75          # 0-1
  box_padding_px: 18         # between the text and the box edge
  words_per_line: 3          # legacy style only
  highlight_color: "#FFD400" # legacy style only
  margin_v: 350              # legacy style only: pixels from the bottom edge, clear of phone UI
  mask_profanity: true       # words in config/wordlists/mask.txt render as f*** in captions and the hook (Brief 11.1); the audio is never changed
hook:                        # the clip's hook line as big text at the start (needs captions.style box_karaoke)
  enabled: true
  seconds: 3.0               # shown from 0 to this; a campaign may set its own hook.seconds
  fade_ms: 150               # fade-out at the end
  font_size: 80              # the hook's own ASS font size, separate from captions.font_size; 20-200
  position: top              # top = the top of the safe area, even over a face; avoid_faces = below faces seen while it is on
safe:                        # pixels the TikTok / Reels / Shorts apps cover (D-023)
  top: 290
  bottom: 560                # organic posts; the strictest published number is 672. To be checked against the real TikTok UI
  left: 120
  right: 192
  button_left: 780           # TikTok's button column starts here (x) ...
  button_top: 840            # ... and here (y); the auto watermark never touches it
campaign:                    # campaign mode (Brief 11): the rules live in campaigns/<slug>/
  max_snap_seconds: 1.5      # a moment's start or end moves at most this far to a clean sentence edge
  corner_zone: 0.15          # fraction of width and height; a watermark may not touch the four corners
  auto_end_target_s: 40      # "end: auto" aims for this clip length in seconds
  name_match_threshold: 0.8  # a transcript span this close to a name (difflib ratio) becomes a spelling rule (Brief 11.1)
  name_suggest_threshold: 0.7   # from here up to name_match_threshold, with the same Soundex key, it is a suggestion in the report only
  auto_watermark_sample: 5   # watermark.position auto: moments scored (the first ones being rendered)
  auto_watermark_frames: 3   # frames read per scored moment for the background luminance
  auto_watermark_face_weight: 0.6    # score = face_weight * face overlap + light_weight * luminance / 255; lower wins
  auto_watermark_light_weight: 0.4
  auto_watermark_x_step: 0.05        # grid steps as fractions of the frame
  auto_watermark_y_step: 0.02
