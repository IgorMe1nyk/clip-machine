name: Example Campaign
source_note: one authorized source video only   # free text, shown in the report
selection: human      # human (default): you list the moments. ai: `scout` may propose them (only where the campaign's rules allow it; Brief 12)
# scout:              # needed with selection: ai
#   per_episode: 8    # moments proposed per source video, at most
#   rules:            # the campaign's rules, as written, passed to the AI as hard constraints
#     - skip ad reads and sponsor segments
#     - never cut mid-thought; every clip has one clear idea or story with a payoff
#   topics:           # topic key -> platform; the AI tags every proposed moment with one key
#     values_purpose_growth: youtube
#     dating_relationships: instagram
#   host_side: left   # optional: left | right; a face on that side in the first seconds is a hint in the report; campaign-init never drafts it
clip_length: { min: 20, max: 60 }
hook:
  mode: full            # full = on screen the whole clip; intro = the first seconds only
  # font_size: 80       # optional; left out, hook.font_size from config/default.yaml is used
  # seconds: 3          # optional, intro mode only; left out, hook.seconds from config/default.yaml
  # position: top       # optional: top | avoid_faces; left out, hook.position from config/default.yaml
  max_chars: 48
watermark:              # optional (Brief 12): leave the whole section out when the campaign wants no watermark
  file: assets/watermark.png
  position: auto        # the default: chosen once by face overlap and background darkness, locked in auto_position.json
  # position: { x_center: 0.5, y_center: 0.18 }   # or fixed: fractions of 1080x1920; never a corner
  scale: 1.0                                    # uniform only; no stretching
captions: { style: box_karaoke }                # font size comes from config/default.yaml
spelling:                                       # caption word fixes; whole word, any case
  - { from: "zorble", to: "Zorb1e" }
  - { from: "q x v", to: "QXV" }                # three words merge into one caption word
names_to_check: [Zorb1e, QXV]                   # listed in the report for a visual check
names: [Zorb1e, QXV]                            # correct spellings; the transcript is scanned for the ways Whisper writes them (auto_spelling.json)
platforms: [tiktok, instagram, youtube]      # "platform: auto" in moments.yaml spreads the moments over these, in this order (Brief 11.2)
posting_times: ["12:30", "15:30", "18:30"]    # posting_plan.csv: one slot each per platform per day, 24-hour Eastern, in quotes
post:
  prefix: { tiktok: "@example", instagram: "@example", youtube: "@example" }   # youtube's goes first in the description
  closers:              # optional (Brief 12): leave empty when the campaign wants no closer line
    - "watch the full episode of the example show @example"
    - "the whole example conversation is on the channel @example"
    - "more from the example show, link on the channel @example"
  hashtags: []
# video:                # optional; each key left out falls back to video.zoom in config/default.yaml
#   zoom:
#     enabled: true     # optional; punch-in zooms on some sentence starts (speaker crop only)
#     style: smooth     # optional; smooth (eased) or punch (instant)
#     ramp_s: 0.4       # optional; seconds one ease takes, 0 to 2; twice it at most min_gap_s
#     scale: 1.15       # optional; the crop window is this much tighter, above 1 and up to 2
#     loud_pct: 0.30    # optional; share of the loudest sentences that may zoom, 0 to 1
#     min_gap_s: 4.0    # optional; least time between two zoom changes
#     max_hold_s: 6.0   # optional; longest a zoom-in lasts, at least min_gap_s
#     max_upscale: 2.1  # optional; a zoom that enlarges the source more than this is skipped
